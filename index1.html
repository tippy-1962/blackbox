<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Choose What's Next</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
  }

  #camera,
  #effect {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #camera {
    object-fit: cover;
    z-index: 0;
  }

  #effect {
    z-index: 2;
    pointer-events: none;
  }

  #welcome {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #111;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 26px;
  }

  h1 {
    font-size: 38px;
    line-height: 1.1;
  }

  p {
    line-height: 1.5;
    color: #ccc;
  }

  button {
    border: 0;
    border-radius: 28px;
    background: #ffb52e;
    color: #111;
    padding: 15px 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
  }

  #hint {
    position: fixed;
    top: max(24px, env(safe-area-inset-top));
    left: 16px;
    right: 16px;
    z-index: 4;
    text-align: center;
    pointer-events: none;
  }

  #hint span {
    display: inline-block;
    background: #111c;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 14px;
  }

  #message {
    position: fixed;
    left: 5%;
    width: 90%;
    top: 68%;
    z-index: 5;
    text-align: center;
    pointer-events: none;
    opacity: 0;

    transform:
      translateY(12px)
      scale(0.85);

    transition:
      opacity 0.4s,
      transform 0.5s;
  }

  #message.visible {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }

  #message strong {
    display: block;
    color: #ffb52e;
    font-size: clamp(27px, 8vw, 43px);
    font-weight: 900;
    line-height: 1;

    text-shadow:
      0 2px 8px black,
      0 0 18px #ffb52e66;
  }

  #message small {
    display: block;
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: 2px;
    text-shadow: 0 2px 6px black;
  }

  #error {
    color: #ffd2a8;
    max-width: 340px;
  }

  [hidden] {
    display: none !important;
  }
</style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline
  webkit-playsinline
></video>

<canvas id="effect"></canvas>

<div id="welcome">
  <div>
    <h1>There's more<br>to this box.</h1>

    <p>Project from the TIP Marketing</p>

    <button id="start">Start camera</button>

    <p id="error" role="alert"></p>
  </div>
</div>

<div id="hint" hidden>
  <span id="status" role="status">
    Looking for the black box…
  </span>
</div>

<div id="message">
  <strong>
    SOMETHING BIG<br>
    IS COMING.
  </strong>

  <small>CHOOSE WHAT'S NEXT</small>
</div>

<script>
"use strict";

const CONFIG = {
  rise: 1350,

  plainHold: 500,

  glow: 900,
  shake: 650,
  split: 850,

  logoDelay: 650,
  logoIn: 1000,

  pulseMs: 3000,

  // Sunset yellow.
  yellow: "#ffb52e"
};

const $ = id => document.getElementById(id);

const video = $("camera");
const canvas = $("effect");
const ctx = canvas.getContext("2d");

const scan = document.createElement("canvas");

const scanCtx = scan.getContext("2d", {
  willReadFrequently: true
});

let W = innerWidth;
let H = innerHeight;

let stream = null;
let active = false;
let failed = false;

let candidate = null;
let target = null;

let confidence = 0;
let candidateSeen = 0;
let lastScan = 0;

let triggered = false;
let startedAt = 0;

let motionAllowed = false;
let motionReceived = false;

let motionBase = null;
let motionLatest = null;

let previousAlpha = null;
let unwrappedAlpha = 0;

let viewYaw = 0;
let viewPitch = 0;

let logoShown = false;
let previousFrame = null;

let audio = null;
let shakeSound = false;
let splitSound = false;

const clamp = (value, min = 0, max = 1) => {
  return Math.max(min, Math.min(max, value));
};

const ease = value => {
  return 1 - Math.pow(1 - clamp(value), 3);
};

const status = text => {
  if ($("status").textContent !== text) {
    $("status").textContent = text;
  }
};

function timing(t) {
  const glowAt =
    CONFIG.rise + CONFIG.plainHold;

  const shakeAt =
    glowAt + CONFIG.glow;

  const splitAt =
    shakeAt + CONFIG.shake;

  const logoAt =
    splitAt +
    CONFIG.split +
    CONFIG.logoDelay;

  return {
    glowAt,
    shakeAt,
    splitAt,
    logoAt,

    rise: clamp(t / CONFIG.rise),

    glow:
      t < glowAt
        ? 0
        : clamp((t - glowAt) / 500),

    shaking:
      t >= shakeAt &&
      t < splitAt,

    split: clamp(
      (t - splitAt) / CONFIG.split
    ),

    reveal:
      t >= splitAt + 220,

    logo: clamp(
      (t - logoAt) / CONFIG.logoIn
    )
  };
}

function resize() {
  W = innerWidth;
  H = innerHeight;

  const dpr = Math.min(
    devicePixelRatio || 1,
    2
  );

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(
    dpr, 0,
    0, dpr,
    0, 0
  );

  scan.width = 160;

  scan.height = Math.max(
    64,
    Math.round(160 * H / W)
  );
}

function reset() {
  candidate = null;
  target = null;

  confidence = 0;
  candidateSeen = 0;
  lastScan = 0;

  triggered = false;
  failed = false;

  startedAt = 0;
  logoShown = false;

  motionBase = null;

  viewYaw = 0;
  viewPitch = 0;

  previousFrame = null;

  shakeSound = false;
  splitSound = false;

  video.style.transform = "";

  $("message").classList.remove("visible");

  status("Looking for the black box…");
}

function overlap(a, b) {
  if (!a || !b) {
    return 0;
  }

  const intersection =
    Math.max(
      0,
      Math.min(a.x + a.w, b.x + b.w) -
      Math.max(a.x, b.x)
    ) *
    Math.max(
      0,
      Math.min(a.y + a.h, b.y + b.h) -
      Math.max(a.y, b.y)
    );

  const union =
    a.w * a.h +
    b.w * b.h -
    intersection;

  return intersection / (union || 1);
}

function detectBox(image) {
  const {
    width: w,
    height: h,
    data
  } = image;

  const N = w * h;

  const gray = new Uint8Array(N);
  const queue = new Int32Array(N);

  for (let i = 0; i < N; i++) {
    gray[i] = Math.round(
      0.2126 * data[i * 4] +
      0.7152 * data[i * 4 + 1] +
      0.0722 * data[i * 4 + 2]
    );
  }

  let best = null;
  let bestScore = 0;

  for (const threshold of [45, 75, 105]) {
    const seen = new Uint8Array(N);

    for (let seed = 0; seed < N; seed++) {
      if (
        seen[seed] ||
        gray[seed] > threshold
      ) {
        continue;
      }

      let head = 0;
      let tail = 0;
      let count = 0;
      let sum = 0;

      let x0 = w;
      let y0 = h;
      let x1 = 0;
      let y1 = 0;

      queue[tail++] = seed;
      seen[seed] = 1;

      while (head < tail) {
        const p = queue[head++];

        const x = p % w;
        const y = Math.floor(p / w);

        count++;
        sum += gray[p];

        x0 = Math.min(x0, x);
        x1 = Math.max(x1, x);

        y0 = Math.min(y0, y);
        y1 = Math.max(y1, y);

        const neighbors = [
          x > 0 ? p - 1 : -1,
          x < w - 1 ? p + 1 : -1,
          y > 0 ? p - w : -1,
          y < h - 1 ? p + w : -1
        ];

        for (const next of neighbors) {
          if (
            next >= 0 &&
            !seen[next] &&
            gray[next] <= threshold
          ) {
            seen[next] = 1;
            queue[tail++] = next;
          }
        }
      }

      const bw = x1 - x0 + 1;
      const bh = y1 - y0 + 1;

      const area = bw * bh;
      const fill = count / area;
      const ratio = bw / bh;

      if (
        area < N * 0.012 ||
        area > N * 0.8 ||
        bw < w * 0.1 ||
        bh < h * 0.08 ||
        ratio < 0.4 ||
        ratio > 2.3 ||
        fill < 0.5
      ) {
        continue;
      }

      const borders =
        Number(x0 === 0) +
        Number(x1 === w - 1) +
        Number(y0 === 0) +
        Number(y1 === h - 1);

      if (borders > 1) {
        continue;
      }

      let ring = 0;
      let samples = 0;

      for (
        let y = Math.max(0, y0 - 3);
        y <= Math.min(h - 1, y1 + 3);
        y++
      ) {
        for (
          let x = Math.max(0, x0 - 3);
          x <= Math.min(w - 1, x1 + 3);
          x++
        ) {
          if (
            x >= x0 &&
            x <= x1 &&
            y >= y0 &&
            y <= y1
          ) {
            continue;
          }

          ring += gray[y * w + x];
          samples++;
        }
      }

      const contrast = samples
        ? ring / samples - sum / count
        : 0;

      if (
        contrast < 12 ||
        sum / count > 95
      ) {
        continue;
      }

      const score =
        count *
        fill *
        (
          0.7 +
          Math.min(contrast, 80) / 80
        );

      if (score > bestScore) {
        bestScore = score;

        best = {
          x: x0 / w,
          y: y0 / h,
          w: bw / w,
          h: bh / h
        };
      }
    }
  }

  return best;
}

function inspect(now) {
  if (
    !video.videoWidth ||
    !video.videoHeight ||
    video.readyState < 2
  ) {
    return;
  }

  const scale = Math.max(
    W / video.videoWidth,
    H / video.videoHeight
  );

  const sourceW = W / scale;
  const sourceH = H / scale;

  scanCtx.drawImage(
    video,

    (video.videoWidth - sourceW) / 2,
    (video.videoHeight - sourceH) / 2,

    sourceW,
    sourceH,

    0,
    0,

    scan.width,
    scan.height
  );

  const found = detectBox(
    scanCtx.getImageData(
      0,
      0,
      scan.width,
      scan.height
    )
  );

  if (!found) {
    if (now - candidateSeen > 650) {
      candidate = null;
      confidence = 0;
    }

    return;
  }

  if (
    overlap(candidate, found) > 0.25 &&
    now - candidateSeen < 650
  ) {
    confidence += Math.min(
      200,
      now - candidateSeen
    );
  } else {
    confidence = 0;
  }

  candidate = found;
  candidateSeen = now;

  status("Box-shaped object found…");

  if (confidence >= 450) {
    target = { ...found };

    triggered = true;
    startedAt = now;

    status("Watch the box.");
  }
}

async function allowMotion() {
  try {
    if (!window.DeviceOrientationEvent) {
      return false;
    }

    if (
      typeof DeviceOrientationEvent
        .requestPermission === "function"
    ) {
      const permission =
        await DeviceOrientationEvent
          .requestPermission();

      return permission === "granted";
    }

    return true;
  } catch {
    return false;
  }
}

addEventListener("deviceorientation", event => {
  if (
    !motionAllowed ||
    event.beta === null ||
    event.gamma === null
  ) {
    return;
  }

  const alpha = event.alpha ?? 0;

  if (previousAlpha !== null) {
    unwrappedAlpha += (
      (alpha - previousAlpha + 540) % 360
    ) - 180;
  }

  previousAlpha = alpha;
  motionReceived = true;

  motionLatest = {
    alpha: unwrappedAlpha,
    beta: event.beta,
    gamma: event.gamma
  };

  if (!motionBase) {
    motionBase = { ...motionLatest };
  }
});

function tone(from, to, duration, volume) {
  if (
    !audio ||
    audio.state !== "running"
  ) {
    return;
  }

  const now = audio.currentTime;

  const oscillator =
    audio.createOscillator();

  const gain =
    audio.createGain();

  oscillator.frequency.setValueAtTime(
    from,
    now
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    to,
    now + duration
  );

  gain.gain.setValueAtTime(
    0.001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    now + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + duration
  );

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.start(now);
  oscillator.stop(now + duration + 0.05);

  oscillator.onended = () => {
    oscillator.disconnect();
    gain.disconnect();
  };
}

function cuboid(
  cx, cy, cz,
  width, height, depth,
  color = "#08090b"
) {
  const x = width / 2;
  const y = height / 2;
  const z = depth / 2;

  const vertices = [
    [-x, -y, -z],
    [ x, -y, -z],
    [ x,  y, -z],
    [-x,  y, -z],

    [-x, -y,  z],
    [ x, -y,  z],
    [ x,  y,  z],
    [-x,  y,  z]
  ].map(point => [
    point[0] + cx,
    point[1] + cy,
    point[2] + cz
  ]);

  const faces = [
    [4, 5, 6, 7],
    [1, 0, 3, 2],
    [0, 4, 7, 3],
    [5, 1, 2, 6],
    [7, 6, 2, 3],
    [0, 1, 5, 4]
  ];

  const shades = [
    "#08090b",
    "#050607",
    "#111318",
    "#050607",
    "#25282d",
    "#070809"
  ];

  return faces.map((face, index) => ({
    v: face.map(i => vertices[i]),

    color:
      color === "#08090b"
        ? shades[index]
        : color
  }));
}

function roundedBlock(
  cx, cy,
  width, height, depth
) {
  const radius = 0.065;
  const ring = [];

  const corners = [
    [
      width / 2 - radius,
      height / 2 - radius,
      0
    ],

    [
      -width / 2 + radius,
      height / 2 - radius,
      90
    ],

    [
      -width / 2 + radius,
      -height / 2 + radius,
      180
    ],

    [
      width / 2 - radius,
      -height / 2 + radius,
      270
    ]
  ];

  for (const [x, y, start] of corners) {
    for (let i = 0; i <= 5; i++) {
      const angle =
        (start + i * 18) *
        Math.PI / 180;

      ring.push([
        x + Math.cos(angle) * radius + cx,
        y + Math.sin(angle) * radius + cy
      ]);
    }
  }

  const front = ring.map(([x, y]) => [
    x,
    y,
    depth / 2
  ]);

  const back = ring.map(([x, y]) => [
    x,
    y,
    -depth / 2
  ]);

  const faces = [
    {
      v: front,
      color: "#030405"
    },

    {
      v: [...back].reverse(),
      color: "#08090b"
    }
  ];

  for (let i = 0; i < ring.length; i++) {
    const next = (i + 1) % ring.length;

    faces.push({
      v: [
        front[i],
        back[i],
        back[next],
        front[next]
      ],

      color: "#17191c"
    });
  }

  return faces;
}

const logoMesh = [
  ...roundedBlock(
    -0.55, 0.62,
    1, 1, 0.48
  ),

  ...roundedBlock(
    0.55, 0.62,
    1, 1, 0.48
  ),

  ...roundedBlock(
    0.55, -0.48,
    1, 1, 0.48
  ),

  ...cuboid(
    0, -1.11, 0,
    2.1, 0.035, 0.16,
    CONFIG.yellow
  )
];

const cubeMesh = cuboid(
  0, 0, 0,
  1, 1, 1
);

function rotate(
  [x, y, z],
  yaw,
  pitch,
  roll = 0
) {
  const cy = Math.cos(yaw);
  const sy = Math.sin(yaw);

  const cp = Math.cos(pitch);
  const sp = Math.sin(pitch);

  const rx = x * cy + z * sy;
  const rz = -x * sy + z * cy;

  const ry = y * cp - rz * sp;
  const rzz = y * sp + rz * cp;

  return [
    rx * Math.cos(roll) -
    ry * Math.sin(roll),

    rx * Math.sin(roll) +
    ry * Math.cos(roll),

    rzz
  ];
}

function polygon(points) {
  ctx.beginPath();

  points.forEach((point, index) => {
    if (index === 0) {
      ctx.moveTo(point.x, point.y);
    } else {
      ctx.lineTo(point.x, point.y);
    }
  });

  ctx.closePath();
}

function renderMesh(
  mesh,
  cx,
  cy,
  scale,
  yaw,
  pitch,
  options = {}
) {
  const polygons = mesh.map((face, index) => {
    const rotated = face.v.map(vertex => {
      return rotate(
        vertex,
        yaw,
        pitch,
        options.roll || 0
      );
    });

    const points = rotated.map(([x, y, z]) => {
      const perspective = 6 / (6 - z);

      return {
        x: cx + x * scale * perspective,
        y: cy - y * scale * perspective
      };
    });

    let moveX = 0;
    let moveY = 0;

    if (options.split) {
      const directions = [
        [-0.75, 0.6],
        [0.5, -0.45],
        [-1, 0],
        [1, 0],
        [0, -1],
        [0.1, 0.8]
      ];

      const direction =
        directions[index % 6];

      moveX =
        direction[0] *
        options.split *
        scale;

      moveY =
        direction[1] *
        options.split *
        scale;
    }

    return {
      face,

      points: points.map(point => ({
        x: point.x + moveX,
        y: point.y + moveY
      })),

      depth: rotated.reduce(
        (sum, point) => sum + point[2],
        0
      ) / rotated.length
    };
  }).sort((a, b) => a.depth - b.depth);

  for (const { face, points } of polygons) {
    ctx.shadowBlur = 0;
    ctx.fillStyle = face.color;

    polygon(points);
    ctx.fill();

    if (options.glow > 0) {
      ctx.strokeStyle =
        `rgba(255,181,46,${options.glow})`;

      ctx.lineWidth = 2;

      ctx.shadowColor = CONFIG.yellow;
      ctx.shadowBlur = 14 * options.glow;

      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
}

function drawSequence(now, dt) {
  const elapsed = now - startedAt;
  const sequence = timing(elapsed);

  const size = Math.min(
    W * 0.65,
    H * 0.34,
    350
  );

  const cx = clamp(
    (target.x + target.w / 2) * W,
    size * 0.7,
    W - size * 0.7
  );

  const ground = clamp(
    (target.y + target.h) * H,
    H * 0.55,
    H * 0.77
  );

  const cy = ground - size * 0.52;

  const riseOffset =
    size *
    1.5 *
    (1 - ease(sequence.rise));

  const quake = sequence.shaking
    ? Math.sin(
        (elapsed - sequence.shakeAt) /
        CONFIG.shake *
        Math.PI
      )
    : 0;

  const sx =
    Math.sin(elapsed * 0.095) *
    5 *
    quake;

  const sy =
    Math.cos(elapsed * 0.11) *
    3 *
    quake;

  video.style.transform = sequence.shaking
    ? `translate(${sx}px, ${sy}px) scale(1.035)`
    : "";

  if (sequence.shaking && !shakeSound) {
    shakeSound = true;

    tone(48, 80, 0.55, 0.1);
  }

  if (sequence.split > 0 && !splitSound) {
    splitSound = true;

    tone(155, 30, 0.7, 0.25);
  }

  ctx.save();
  ctx.translate(sx, sy);

  if (sequence.rise < 1) {
    ctx.beginPath();
    ctx.rect(0, 0, W, ground + 2);
    ctx.clip();
  }

  const panelFade =
    1 - clamp(
      (
        elapsed -
        (sequence.splitAt + CONFIG.split)
      ) / 800
    );

  if (panelFade > 0) {
    ctx.globalAlpha = panelFade;

    const pulse =
      0.72 +
      0.28 * Math.sin(
        elapsed *
        Math.PI * 2 /
        CONFIG.pulseMs
      );

    renderMesh(
      cubeMesh,

      cx,
      cy + riseOffset,

      size,

      0.42,
      0.18,

      {
        glow: sequence.glow * pulse,

        roll:
          Math.sin(elapsed * 0.08) *
          0.07 *
          quake,

        split:
          ease(sequence.split) * 1.3
      }
    );

    ctx.globalAlpha = 1;
  }

  if (
    sequence.split > 0 &&
    sequence.split < 0.3
  ) {
    ctx.fillStyle =
      `rgba(
        255,218,120,
        ${(1 - sequence.split / 0.3) * 0.22}
      )`;

    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();

  $("message").classList.toggle(
    "visible",
    sequence.reveal
  );

  if (sequence.logo > 0) {
    if (!logoShown) {
      logoShown = true;

      motionBase = motionLatest
        ? { ...motionLatest }
        : null;
    }

    let yawTarget = 0.16;
    let pitchTarget = 0.12;

    if (
      motionReceived &&
      motionBase &&
      motionLatest
    ) {
      yawTarget =
        0.16 -
        (
          motionLatest.alpha -
          motionBase.alpha
        ) * Math.PI / 180 +
        (
          motionLatest.gamma -
          motionBase.gamma
        ) * 0.012;

      pitchTarget =
        0.12 +
        clamp(
          (
            motionLatest.beta -
            motionBase.beta
          ) * Math.PI / 180,

          -1.1,
          1.1
        );
    } else {

      yawTarget =
        0.16 +
        (
          elapsed -
          sequence.logoAt
        ) / 1000 * 0.35;
    }

    const smoothing =
      1 - Math.exp(-dt * 7);

    viewYaw +=
      (yawTarget - viewYaw) * smoothing;

    viewPitch +=
      (pitchTarget - viewPitch) * smoothing;

    const show = ease(sequence.logo);

    const logoScale =
      Math.min(
        W * 0.31,
        H * 0.19,
        150
      ) *
      (0.75 + 0.25 * show);

    ctx.save();
    ctx.globalAlpha = show;

    renderMesh(
      logoMesh,

      W / 2,
      H * 0.34 + (1 - show) * 40,

      logoScale,

      viewYaw,
      viewPitch
    );

    ctx.restore();
  }

  status(
    sequence.logo > 0
      ? motionReceived
        ? "Tilt your phone to explore."
        : "3D view — motion access is unavailable."
      : sequence.reveal
        ? "Choose what’s next."
        : sequence.shaking
          ? "Something’s breaking through…"
          : elapsed >= sequence.glowAt
            ? "Something is stirring…"
            : sequence.rise < 1
              ? "Watch the box rise."
              : "Wait for it…"
  );
}

function animate(now) {
  requestAnimationFrame(animate);

  const dt = previousFrame === null
    ? 0
    : Math.min(
        (now - previousFrame) / 1000,
        0.05
      );

  previousFrame = now;

  ctx.clearRect(0, 0, W, H);

  video.style.transform = "";

  if (
    !active ||
    document.hidden ||
    video.paused
  ) {
    return;
  }

  if (
    !triggered &&
    !failed &&
    now - lastScan >= 180
  ) {
    lastScan = now;

    try {
      inspect(now);
    } catch (error) {
      failed = true;

      status(
        "Detection stopped. Reload this page."
      );

      console.error(error);
    }
  }

  if (triggered) {
    drawSequence(now, dt);
  } else if (!candidate && !failed) {
    status("Looking for the black box…");
  }

}

$("start").onclick = async () => {
  $("start").disabled = true;
  $("error").textContent = "";

  const motionRequest = allowMotion();

  try {
    const Audio =
      window.AudioContext ||
      window.webkitAudioContext;

    if (Audio) {
      audio ??= new Audio();

      audio.resume().catch(() => {});
    }
  } catch {}

  try {
    if (
      !isSecureContext ||
      !navigator.mediaDevices?.getUserMedia
    ) {
      throw new Error("HTTPS_REQUIRED");
    }

    const hasLiveCamera = stream
      ?.getVideoTracks()
      .some(track => {
        return track.readyState === "live";
      });

    if (!hasLiveCamera) {
      stream =
        await navigator.mediaDevices.getUserMedia({
          audio: false,

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          }
        });

      video.srcObject = stream;
    }

    video.muted = true;

    await video.play();

    motionAllowed = await motionRequest;

    active = true;

    reset();
    resize();

    $("welcome").hidden = true;
    $("hint").hidden = false;
  } catch (error) {
    $("start").disabled = false;
    $("start").textContent = "Try again";

    $("error").textContent =
      error.message === "HTTPS_REQUIRED"
        ? "Open your HTTPS GitHub Pages link."
        : error.name === "NotAllowedError"
          ? "Allow camera access, then try again."
          : "Camera unavailable. Open this page directly in Safari or Chrome.";

    console.error(error);
  }
};

addEventListener("resize", resize);

addEventListener("orientationchange", () => {
  motionBase = null;
  previousAlpha = null;
});

document.addEventListener(
  "visibilitychange",
  () => {
    previousFrame = null;

    if (!document.hidden) {
      reset();
    }
  }
);

addEventListener("pagehide", () => {
  stream?.getTracks().forEach(track => {
    track.stop();
  });

  stream = null;
  active = false;

  reset();

  $("welcome").hidden = false;
  $("hint").hidden = true;
  $("start").disabled = false;
});

resize();
requestAnimationFrame(animate);
</script>
