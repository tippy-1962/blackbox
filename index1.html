<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Something Big Is Coming</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
  }

  #camera,
  #effect {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #camera {
    object-fit: cover;
    z-index: 0;
  }

  #effect {
    pointer-events: none;
    z-index: 2;
  }

  #welcome {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: #111;
    padding: 26px;
    text-align: center;
  }

  h1 {
    font-size: 38px;
    line-height: 1.1;
    margin: 0 0 18px;
  }

  p {
    color: #ccc;
    line-height: 1.5;
  }

  button {
    border: none;
    border-radius: 28px;
    background: #ffdc51;
    color: #111;
    padding: 15px 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
  }

  #hint {
    position: fixed;
    top: max(24px, env(safe-area-inset-top));
    left: 16px;
    right: 16px;
    z-index: 4;
    text-align: center;
    pointer-events: none;
  }

  #hint span {
    display: inline-block;
    background: #111c;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
  }

  #popup {
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(90vw, 400px);
    z-index: 5;
    text-align: center;
    pointer-events: none;
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(0.72);

    transition:
      opacity 0.25s,
      transform 0.5s cubic-bezier(.16, 1, .3, 1);
  }

  #popup.visible {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

  #popup .card {
    display: inline-block;
    padding: 20px 14px;

    background: radial-gradient(
      ellipse,
      #111e,
      #1118 50%,
      transparent 72%
    );
  }

  #popup strong {
    display: block;
    color: #ffdc51;
    font-weight: 900;
    font-size: clamp(24px, 7vw, 42px);
    line-height: 0.98;

    text-shadow:
      0 0 16px #ffcf5477,
      0 3px 8px black;
  }

  #popup small {
    display: block;
    margin-top: 12px;
    font-size: 10px;
    color: white;
    letter-spacing: 2px;
  }

  #error {
    color: #ffd2a8;
    max-width: 340px;
  }

  [hidden] {
    display: none !important;
  }
</style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline
  webkit-playsinline
></video>

<canvas id="effect"></canvas>

<div id="welcome">
  <div>
    <h1>There’s more<br>to this box.</h1>

    <p>Point your camera at the black box.</p>

    <button id="start">Start camera</button>

    <p id="error" role="alert"></p>
  </div>
</div>

<div id="hint" hidden>
  <span id="status" role="status">
    Looking for the black box…
  </span>
</div>

<div id="popup">
  <div class="card">
    <strong>
      SOMETHING BIG<br>
      IS COMING.
    </strong>

    <small>CHOOSE WHAT’S NEXT</small>
  </div>
</div>

<script>
"use strict";

const CONFIG = {
  physicalFeet: 9,
  virtualFeet: 3,

  riseMs: 1350,
  holdMs: 1000,
  shakeMs: 650,
  openMs: 850,

  pulseMs: 3000
};

const $ = id => document.getElementById(id);

const video = $("camera");
const canvas = $("effect");
const ctx = canvas.getContext("2d");

const scan = document.createElement("canvas");

const scanCtx = scan.getContext("2d", {
  willReadFrequently: true
});

let W = innerWidth;
let H = innerHeight;

let stream = null;
let active = false;

let target = null;
let candidate = null;
let confidenceMs = 0;
let candidateSeen = 0;

let triggered = false;
let startedAt = 0;
let lastSeen = 0;
let lastScan = 0;

let detectionFailed = false;

let audio = null;
let rumblePlayed = false;
let burstPlayed = false;

const clamp = value => {
  return Math.max(0, Math.min(1, value));
};

const status = text => {
  if ($("status").textContent !== text) {
    $("status").textContent = text;
  }
};

function stage(now) {
  const elapsed = Math.max(
    0,
    now - startedAt
  );

  const shakeStart =
    CONFIG.riseMs + CONFIG.holdMs;

  const openStart =
    shakeStart + CONFIG.shakeMs;

  return {
    elapsed,
    shakeStart,
    openStart,

    rise: clamp(
      elapsed / CONFIG.riseMs
    ),

    shake:
      elapsed >= shakeStart &&
      elapsed < openStart,

    open: clamp(
      (elapsed - openStart) /
      CONFIG.openMs
    )
  };
}

function tone(
  startHz,
  endHz,
  seconds,
  volume
) {
  if (
    !audio ||
    audio.state !== "running"
  ) {
    return;
  }

  const now = audio.currentTime;

  const oscillator =
    audio.createOscillator();

  const gain =
    audio.createGain();

  oscillator.frequency.setValueAtTime(
    startHz,
    now
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    endHz,
    now + seconds
  );

  gain.gain.setValueAtTime(
    0.001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    volume,
    now + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    now + seconds
  );

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.start(now);
  oscillator.stop(now + seconds + 0.05);

  oscillator.onended = () => {
    oscillator.disconnect();
    gain.disconnect();
  };
}

function reset() {
  target = null;
  candidate = null;

  confidenceMs = 0;
  candidateSeen = 0;

  triggered = false;
  startedAt = 0;
  lastSeen = 0;
  lastScan = 0;

  detectionFailed = false;

  rumblePlayed = false;
  burstPlayed = false;

  video.style.transform = "";

  $("popup").classList.remove("visible");

  status("Looking for the black box…");
}

function resize() {
  W = innerWidth;
  H = innerHeight;

  const dpr = Math.min(
    devicePixelRatio || 1,
    2
  );

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(
    dpr, 0,
    0, dpr,
    0, 0
  );

  scan.width = 160;

  scan.height = Math.max(
    64,
    Math.round(160 * H / W)
  );
}

function overlap(a, b) {
  if (!a || !b) {
    return 0;
  }

  const intersection =
    Math.max(
      0,
      Math.min(
        a.x + a.w,
        b.x + b.w
      ) - Math.max(a.x, b.x)
    ) *
    Math.max(
      0,
      Math.min(
        a.y + a.h,
        b.y + b.h
      ) - Math.max(a.y, b.y)
    );

  const union =
    a.w * a.h +
    b.w * b.h -
    intersection;

  return intersection / (union || 1);
}

// Automatic dark-region detection.
function detectBox(image) {
  const {
    width: w,
    height: h,
    data
  } = image;

  const N = w * h;

  const gray = new Uint8Array(N);
  const queue = new Int32Array(N);

  for (let i = 0; i < N; i++) {
    gray[i] = Math.round(
      0.2126 * data[i * 4] +
      0.7152 * data[i * 4 + 1] +
      0.0722 * data[i * 4 + 2]
    );
  }

  let best = null;
  let bestScore = 0;

  for (const threshold of [45, 75, 105]) {
    const seen = new Uint8Array(N);

    for (let seed = 0; seed < N; seed++) {
      if (
        seen[seed] ||
        gray[seed] > threshold
      ) {
        continue;
      }

      let head = 0;
      let tail = 0;
      let n = 0;
      let sum = 0;

      let x0 = w;
      let y0 = h;
      let x1 = 0;
      let y1 = 0;

      queue[tail++] = seed;
      seen[seed] = 1;

      while (head < tail) {
        const p = queue[head++];

        const x = p % w;
        const y = Math.floor(p / w);

        n++;
        sum += gray[p];

        x0 = Math.min(x0, x);
        x1 = Math.max(x1, x);

        y0 = Math.min(y0, y);
        y1 = Math.max(y1, y);

        const neighbors = [
          x > 0 ? p - 1 : -1,
          x < w - 1 ? p + 1 : -1,
          y > 0 ? p - w : -1,
          y < h - 1 ? p + w : -1
        ];

        for (const q of neighbors) {
          if (
            q >= 0 &&
            !seen[q] &&
            gray[q] <= threshold
          ) {
            seen[q] = 1;
            queue[tail++] = q;
          }
        }
      }

      const bw = x1 - x0 + 1;
      const bh = y1 - y0 + 1;

      const area = bw * bh;
      const fill = n / area;
      const ratio = bw / bh;

      if (
        area < N * 0.012 ||
        area > N * 0.8 ||
        bw < w * 0.1 ||
        bh < h * 0.08 ||
        ratio < 0.4 ||
        ratio > 2.3 ||
        fill < 0.5
      ) {
        continue;
      }

      const borders =
        Number(x0 === 0) +
        Number(x1 === w - 1) +
        Number(y0 === 0) +
        Number(y1 === h - 1);

      if (borders > 1) {
        continue;
      }

      let ring = 0;
      let samples = 0;

      for (
        let y = Math.max(0, y0 - 3);
        y <= Math.min(h - 1, y1 + 3);
        y++
      ) {
        for (
          let x = Math.max(0, x0 - 3);
          x <= Math.min(w - 1, x1 + 3);
          x++
        ) {
          if (
            x >= x0 &&
            x <= x1 &&
            y >= y0 &&
            y <= y1
          ) {
            continue;
          }

          ring += gray[y * w + x];
          samples++;
        }
      }

      const contrast = samples
        ? ring / samples - sum / n
        : 0;

      if (
        contrast < 12 ||
        sum / n > 95
      ) {
        continue;
      }

      const score =
        n *
        fill *
        (
          0.7 +
          Math.min(contrast, 80) / 80
        );

      if (score > bestScore) {
        bestScore = score;

        best = {
          x: x0 / w,
          y: y0 / h,
          w: bw / w,
          h: bh / h
        };
      }
    }
  }

  return best;
}

function inspect(now) {
  if (
    !video.videoWidth ||
    !video.videoHeight ||
    video.readyState < 2
  ) {
    return;
  }

  const scale = Math.max(
    W / video.videoWidth,
    H / video.videoHeight
  );

  const sourceW = W / scale;
  const sourceH = H / scale;

  scanCtx.drawImage(
    video,

    (video.videoWidth - sourceW) / 2,
    (video.videoHeight - sourceH) / 2,

    sourceW,
    sourceH,

    0,
    0,

    scan.width,
    scan.height
  );

  const found = detectBox(
    scanCtx.getImageData(
      0,
      0,
      scan.width,
      scan.height
    )
  );

  if (!found) {
    if (
      !triggered &&
      now - candidateSeen > 650
    ) {
      candidate = null;
      confidenceMs = 0;

      status("Looking for the black box…");
    }

    return;
  }

  if (triggered) {
    if (overlap(target, found) > 0.15) {
      for (const key of ["x", "y", "w", "h"]) {
        target[key] += (
          found[key] - target[key]
        ) * 0.3;
      }

      lastSeen = now;
    }

    return;
  }

  if (
    overlap(candidate, found) > 0.25 &&
    now - candidateSeen < 650
  ) {
    confidenceMs += Math.min(
      now - candidateSeen,
      200
    );
  } else {
    confidenceMs = 0;
  }

  candidate = found;
  candidateSeen = now;

  status("Box-shaped object found…");

  if (confidenceMs >= 450) {
    target = { ...found };

    triggered = true;
    startedAt = now;
    lastSeen = now;

    status("Something is stirring…");
  }
}

function path(points) {
  ctx.beginPath();

  points.forEach(([x, y], index) => {
    if (index === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  });

  ctx.closePath();
}

// Rise, hold, shake, split and reveal.
function draw(now) {
  const box = {
    x: target.x * W,
    y: target.y * H,
    w: target.w * W,
    h: target.h * H
  };

  const size =
    box.w *
    CONFIG.virtualFeet /
    CONFIG.physicalFeet;

  const ground = Math.min(
    H - 12,
    box.y + box.h
  );

  const cx = box.x + box.w / 2;
  const cy = ground - size * 0.5;

  const st = stage(now);

  const eased =
    1 - Math.pow(1 - st.rise, 4);

  const offset =
    size * 1.3 * (1 - eased);

  const burst =
    1 - Math.pow(1 - st.open, 3);

  const shaking = st.shake
    ? Math.sin(
        (st.elapsed - st.shakeStart) /
        CONFIG.shakeMs *
        Math.PI
      )
    : 0;

  const sx =
    Math.sin(st.elapsed * 0.095) *
    5 *
    shaking;

  const sy =
    Math.cos(st.elapsed * 0.125) *
    3 *
    shaking;

  const twist =
    Math.sin(st.elapsed * 0.08) *
    0.075 *
    shaking;

  const pulse =
    0.55 +
    0.45 * Math.sin(
      st.elapsed *
      Math.PI * 2 /
      CONFIG.pulseMs
    );

  if (st.shake && !rumblePlayed) {
    rumblePlayed = true;

    tone(48, 75, 0.5, 0.12);
  }

  if (st.open > 0 && !burstPlayed) {
    burstPlayed = true;

    tone(155, 30, 0.7, 0.3);
  }

  video.style.transform = st.shake
    ? `translate(${sx}px, ${sy}px) scale(1.035)`
    : "";

  ctx.save();
  ctx.translate(sx, sy);

  // Hide the portion still below the ground.
  if (st.rise < 1) {
    ctx.beginPath();

    ctx.rect(
      0,
      0,
      W,
      Math.max(0, ground + 2)
    );

    ctx.clip();
  }

  // Yellow energy glow.
  const glowRadius = Math.max(
    1,
    size * (0.65 + burst)
  );

  const glow = ctx.createRadialGradient(
    cx, cy, 0,
    cx, cy, glowRadius
  );

  const power = st.shake
    ? 0.24
    : st.open > 0
      ? 0.45 * (1 - st.open * 0.5)
      : 0.045;

  glow.addColorStop(
    0,
    `rgba(255,219,65,${power})`
  );

  glow.addColorStop(
    1,
    "rgba(255,210,20,0)"
  );

  ctx.fillStyle = glow;

  ctx.fillRect(
    cx - glowRadius,
    cy - glowRadius,
    glowRadius * 2,
    glowRadius * 2
  );

  // Six cube panels.
  const faces = [
    {
      v: [
        [-0.5, -0.5, 0.5],
        [0.5, -0.5, 0.5],
        [0.5, 0.5, 0.5],
        [-0.5, 0.5, 0.5]
      ],
      dir: [-0.55, 0.65],
      color: "#090a0c"
    },

    {
      v: [
        [0.5, -0.5, -0.5],
        [-0.5, -0.5, -0.5],
        [-0.5, 0.5, -0.5],
        [0.5, 0.5, -0.5]
      ],
      dir: [0.5, -0.4],
      color: "#08090a"
    },

    {
      v: [
        [-0.5, -0.5, -0.5],
        [-0.5, -0.5, 0.5],
        [-0.5, 0.5, 0.5],
        [-0.5, 0.5, -0.5]
      ],
      dir: [-1, -0.05],
      color: "#101114"
    },

    {
      v: [
        [0.5, -0.5, 0.5],
        [0.5, -0.5, -0.5],
        [0.5, 0.5, -0.5],
        [0.5, 0.5, 0.5]
      ],
      dir: [1, 0.05],
      color: "#060708"
    },

    {
      v: [
        [-0.5, 0.5, 0.5],
        [0.5, 0.5, 0.5],
        [0.5, 0.5, -0.5],
        [-0.5, 0.5, -0.5]
      ],
      dir: [0, -0.9],
      color: "#24262a"
    },

    {
      v: [
        [-0.5, -0.5, -0.5],
        [0.5, -0.5, -0.5],
        [0.5, -0.5, 0.5],
        [-0.5, -0.5, 0.5]
      ],
      dir: [0.1, 0.65],
      color: "#08090b"
    }
  ];

  const yaw = 0.43 + twist;

  const cos = Math.cos(yaw);
  const sin = Math.sin(yaw);

  const panels = faces.map((face, index) => {
    const projected = face.v.map(([x, y, z]) => {
      const rx = x * cos + z * sin;
      const rz = -x * sin + z * cos;

      return {
        x: rx * size / 1.33,

        y:
          (-y * 0.94 + rz * 0.34) *
          size / 1.33,

        z:
          y * 0.34 + rz * 0.94
      };
    });

    const mx = projected.reduce(
      (sum, point) => sum + point.x,
      0
    ) / 4;

    const my = projected.reduce(
      (sum, point) => sum + point.y,
      0
    ) / 4;

    const angle =
      burst * (index % 2 ? -0.28 : 0.28);

    const c = Math.cos(angle);
    const s = Math.sin(angle);

    return {
      color: face.color,

      depth: projected.reduce(
        (sum, point) => sum + point.z,
        0
      ) / 4,

      points: projected.map(point => [
        cx +
        mx +
        (point.x - mx) * c -
        (point.y - my) * s +
        face.dir[0] * size * burst * 1.25,

        cy +
        offset +
        my +
        (point.x - mx) * s +
        (point.y - my) * c +
        face.dir[1] * size * burst * 0.9
      ])
    };
  }).sort((a, b) => a.depth - b.depth);

  // Draw panels from back to front.
  for (const panel of panels) {
    ctx.globalAlpha = 1 - burst * 0.28;
    ctx.shadowBlur = 0;

    ctx.fillStyle = panel.color;

    path(panel.points);
    ctx.fill();

    // Soft yellow glow plus bright edge.
    for (let pass = 0; pass < 2; pass++) {
      path(panel.points);

      ctx.lineJoin = "round";

      ctx.strokeStyle = pass
        ? "#fff0a0"
        : `rgba(255,209,32,${0.55 + pulse * 0.4})`;

      ctx.lineWidth = pass ? 1.3 : 3;

      ctx.shadowColor = "#ffd52b";

      ctx.shadowBlur = pass
        ? 2
        : 10 + pulse * 12 + shaking * 10;

      ctx.stroke();
    }
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Brief flash and expanding light ring.
  if (st.open > 0) {
    const flash = Math.max(
      0,
      1 - st.open * 5
    );

    if (flash > 0) {
      ctx.fillStyle =
        `rgba(255,236,157,${flash * 0.28})`;

      ctx.fillRect(0, 0, W, H);
    }

    if (st.open < 1) {
      ctx.beginPath();

      ctx.ellipse(
        cx,
        cy,

        size * (0.2 + st.open * 2),
        size * (0.07 + st.open * 0.6),

        0,
        0,
        Math.PI * 2
      );

      ctx.strokeStyle =
        `rgba(255,220,81,${(1 - st.open) * 0.8})`;

      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  ctx.restore();

  // Reveal the text between the separated panels.
  const textY = Math.max(
    100,
    Math.min(H - 110, cy)
  );

  const textX = Math.max(
    W * 0.46,
    Math.min(W * 0.54, cx)
  );

  $("popup").style.left = textX + "px";
  $("popup").style.top = textY + "px";

  $("popup").classList.toggle(
    "visible",
    st.open > 0.22
  );

  status(
    st.rise < 1
      ? "Something is rising…"
      : st.elapsed < st.shakeStart
        ? "Wait for it…"
        : st.shake
          ? "Something’s breaking through…"
          : "Choose what’s next."
  );
}

function animate(now) {
  requestAnimationFrame(animate);

  ctx.clearRect(0, 0, W, H);

  video.style.transform = "";

  if (
    !active ||
    document.hidden ||
    video.paused
  ) {
    return;
  }

  if (
    !detectionFailed &&
    now - lastScan >= 180
  ) {
    lastScan = now;

    try {
      inspect(now);
    } catch (error) {
      detectionFailed = true;

      status(
        "Detection stopped. Reload this page."
      );

      console.error(error);
    }
  }

  if (detectionFailed) {
    return;
  }

  if (triggered) {
    const missing = now - lastSeen;

    if (missing > 4000) {
      reset();
      return;
    }

    if (missing > 1500) {
      $("popup").classList.remove("visible");

      status("Point back at the black box.");

      return;
    }

    draw(now);
  } else if (
    candidate &&
    now - candidateSeen < 650
  ) {
    ctx.strokeStyle =
      "rgba(255,220,81,.55)";

    ctx.lineWidth = 1.5;

    ctx.strokeRect(
      candidate.x * W,
      candidate.y * H,
      candidate.w * W,
      candidate.h * H
    );
  }
}

$("start").onclick = async () => {
  $("start").disabled = true;
  $("error").textContent = "";

  // Unlock audio during the user's camera-start tap.
  try {
    const Audio =
      window.AudioContext ||
      window.webkitAudioContext;

    if (Audio) {
      audio ??= new Audio();

      audio.resume().catch(() => {});
    }
  } catch {}

  try {
    if (
      !isSecureContext ||
      !navigator.mediaDevices?.getUserMedia
    ) {
      throw new Error("HTTPS_REQUIRED");
    }

    const hasLiveCamera = stream
      ?.getVideoTracks()
      .some(track => {
        return track.readyState === "live";
      });

    if (!hasLiveCamera) {
      stream =
        await navigator.mediaDevices.getUserMedia({
          audio: false,

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          }
        });

      video.srcObject = stream;
    }

    video.muted = true;

    await video.play();

    active = true;

    reset();
    resize();

    $("welcome").hidden = true;
    $("hint").hidden = false;
  } catch (error) {
    $("start").disabled = false;
    $("start").textContent = "Try again";

    $("error").textContent =
      error.message === "HTTPS_REQUIRED"
        ? "Open your HTTPS GitHub Pages link."
        : error.name === "NotAllowedError"
          ? "Allow camera access, then try again."
          : "Could not start camera. Open this page directly in Safari or Chrome.";

    console.error(error);
  }
};

addEventListener("resize", resize);

addEventListener("pagehide", () => {
  stream?.getTracks().forEach(track => {
    track.stop();
  });

  stream = null;
  active = false;

  reset();

  $("welcome").hidden = false;
  $("hint").hidden = true;
  $("start").disabled = false;
});

document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      reset();
    }
  }
);

resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
