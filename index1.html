<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>Something’s Taking Shape</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
  }

  #camera,
  #effect {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #camera {
    object-fit: cover;
    z-index: 0;
  }

  #effect {
    pointer-events: none;
    z-index: 2;
  }

  #welcome {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    background: #111;
    text-align: center;
    padding: 26px;
  }

  h1 {
    font-size: 38px;
    line-height: 1.1;
    margin: 0 0 18px;
  }

  p {
    color: #ccc;
    line-height: 1.5;
  }

  button {
    border: 0;
    border-radius: 28px;
    background: #ffdc51;
    color: #111;
    padding: 15px 28px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
  }

  #hint {
    position: fixed;
    top: max(24px, env(safe-area-inset-top));
    left: 16px;
    right: 16px;
    z-index: 4;
    text-align: center;
    pointer-events: none;
  }

  #hint span {
    display: inline-block;
    background: #111c;
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14px;
  }

  #popup {
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: max(44px, env(safe-area-inset-bottom));
    z-index: 5;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(12px);

    transition:
      opacity 0.7s,
      transform 0.7s;
  }

  #popup.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #popup .card {
    display: inline-block;
    border: 1px solid #ffdc5166;
    border-radius: 18px;
    background: #111d;
    padding: 18px 24px;
  }

  #popup strong {
    display: block;
    color: #ffdc51;
    font-size: 24px;
  }

  #popup small {
    display: block;
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 1px;
  }

  #error {
    color: #ffd2a8;
    max-width: 340px;
  }

  [hidden] {
    display: none !important;
  }
</style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline
  webkit-playsinline
></video>

<canvas id="effect"></canvas>

<div id="welcome">
  <div>
    <h1>There’s more<br>to this box.</h1>

    <p>Point your camera at the black box.</p>

    <button id="start">Start camera</button>

    <p id="error" role="alert"></p>
  </div>
</div>

<div id="hint" hidden>
  <span id="status" role="status">
    Looking for the black box…
  </span>
</div>

<div id="popup">
  <div class="card">
    <strong>Something’s taking shape.</strong>
    <small>CHOOSE WHAT’S NEXT</small>
  </div>
</div>

<script>
"use strict";

const CONFIG = {
  physicalFeet: 9,
  virtualFeet: 3,
  riseMs: 2200,
  pulseMs: 3200
};

const $ = id => document.getElementById(id);

const video = $("camera");
const canvas = $("effect");
const ctx = canvas.getContext("2d");

const scan = document.createElement("canvas");

const scanCtx = scan.getContext("2d", {
  willReadFrequently: true
});

let W = innerWidth;
let H = innerHeight;

let stream = null;
let active = false;

let target = null;
let candidate = null;

let confidenceMs = 0;
let candidateSeen = 0;

let triggered = false;
let startedAt = 0;
let lastSeen = 0;
let lastScan = 0;

let detectionFailed = false;

const status = text => {
  if ($("status").textContent !== text) {
    $("status").textContent = text;
  }
};

function reset() {
  target = null;
  candidate = null;

  confidenceMs = 0;
  candidateSeen = 0;

  triggered = false;
  startedAt = 0;
  lastSeen = 0;
  lastScan = 0;

  detectionFailed = false;

  $("popup").classList.remove("visible");

  status("Looking for the black box…");
}

function resize() {
  W = innerWidth;
  H = innerHeight;

  const dpr = Math.min(
    devicePixelRatio || 1,
    2
  );

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  scan.width = 160;

  scan.height = Math.max(
    64,
    Math.round(160 * H / W)
  );

}

function overlap(a, b) {
  if (!a || !b) {
    return 0;
  }

  const intersection =
    Math.max(
      0,
      Math.min(a.x + a.w, b.x + b.w) -
      Math.max(a.x, b.x)
    ) *
    Math.max(
      0,
      Math.min(a.y + a.h, b.y + b.h) -
      Math.max(a.y, b.y)
    );

  const union =
    a.w * a.h +
    b.w * b.h -
    intersection;

  return intersection / (union || 1);
}

function detectBox(image) {
  const {
    width: w,
    height: h,
    data
  } = image;

  const N = w * h;

  const gray = new Uint8Array(N);
  const queue = new Int32Array(N);

  for (let i = 0; i < N; i++) {
    gray[i] = Math.round(
      0.2126 * data[i * 4] +
      0.7152 * data[i * 4 + 1] +
      0.0722 * data[i * 4 + 2]
    );
  }

  let best = null;
  let bestScore = 0;

  for (const threshold of [45, 75, 105]) {
    const seen = new Uint8Array(N);

    for (let seed = 0; seed < N; seed++) {
      if (
        seen[seed] ||
        gray[seed] > threshold
      ) {
        continue;
      }

      let head = 0;
      let tail = 0;
      let n = 0;
      let sum = 0;

      let x0 = w;
      let y0 = h;
      let x1 = 0;
      let y1 = 0;

      queue[tail++] = seed;
      seen[seed] = 1;

      while (head < tail) {
        const p = queue[head++];

        const x = p % w;
        const y = Math.floor(p / w);

        n++;
        sum += gray[p];

        x0 = Math.min(x0, x);
        x1 = Math.max(x1, x);

        y0 = Math.min(y0, y);
        y1 = Math.max(y1, y);

        const neighbors = [
          x > 0 ? p - 1 : -1,
          x < w - 1 ? p + 1 : -1,
          y > 0 ? p - w : -1,
          y < h - 1 ? p + w : -1
        ];

        for (const q of neighbors) {
          if (
            q >= 0 &&
            !seen[q] &&
            gray[q] <= threshold
          ) {
            seen[q] = 1;
            queue[tail++] = q;
          }
        }
      }

      const bw = x1 - x0 + 1;
      const bh = y1 - y0 + 1;

      const area = bw * bh;
      const fill = n / area;
      const ratio = bw / bh;

      if (
        area < N * 0.012 ||
        area > N * 0.8 ||
        bw < w * 0.1 ||
        bh < h * 0.08 ||
        ratio < 0.4 ||
        ratio > 2.3 ||
        fill < 0.5
      ) {
        continue;
      }

      const borders =
        Number(x0 === 0) +
        Number(x1 === w - 1) +
        Number(y0 === 0) +
        Number(y1 === h - 1);

      if (borders > 1) {
        continue;
      }

      let ring = 0;
      let samples = 0;

      for (
        let y = Math.max(0, y0 - 3);
        y <= Math.min(h - 1, y1 + 3);
        y++
      ) {
        for (
          let x = Math.max(0, x0 - 3);
          x <= Math.min(w - 1, x1 + 3);
          x++
        ) {
          if (
            x >= x0 &&
            x <= x1 &&
            y >= y0 &&
            y <= y1
          ) {
            continue;
          }

          ring += gray[y * w + x];
          samples++;
        }
      }

      const contrast = samples
        ? ring / samples - sum / n
        : 0;

      if (
        contrast < 12 ||
        sum / n > 95
      ) {
        continue;
      }

      const score =
        n *
        fill *
        (
          0.7 +
          Math.min(contrast, 80) / 80
        );

      if (score > bestScore) {
        bestScore = score;

        best = {
          x: x0 / w,
          y: y0 / h,
          w: bw / w,
          h: bh / h
        };
      }
    }
  }

  return best;
}

function inspect(now) {
  if (
    !video.videoWidth ||
    !video.videoHeight ||
    video.readyState < 2
  ) {
    return;
  }

  const scale = Math.max(
    W / video.videoWidth,
    H / video.videoHeight
  );

  const sourceW = W / scale;
  const sourceH = H / scale;

  scanCtx.drawImage(
    video,

    (video.videoWidth - sourceW) / 2,
    (video.videoHeight - sourceH) / 2,

    sourceW,
    sourceH,

    0,
    0,

    scan.width,
    scan.height
  );

  const found = detectBox(
    scanCtx.getImageData(
      0,
      0,
      scan.width,
      scan.height
    )
  );

  if (!found) {
    if (
      !triggered &&
      now - candidateSeen > 650
    ) {
      candidate = null;
      confidenceMs = 0;

      status("Looking for the black box…");
    }

    return;
  }

  if (triggered) {
    if (overlap(target, found) > 0.15) {
      for (const key of ["x", "y", "w", "h"]) {
        target[key] += (
          found[key] - target[key]
        ) * 0.3;
      }

      lastSeen = now;
    }

    return;
  }

  if (
    overlap(candidate, found) > 0.25 &&
    now - candidateSeen < 650
  ) {
    confidenceMs += Math.min(
      now - candidateSeen,
      200
    );
  } else {
    confidenceMs = 0;
  }

  candidate = found;
  candidateSeen = now;

  status("Box-shaped object found…");

  if (confidenceMs >= 450) {
    target = { ...found };

    triggered = true;
    startedAt = now;
    lastSeen = now;

    status("Something is stirring…");
  }
}

function path(points) {
  ctx.beginPath();

  points.forEach(([x, y], index) => {
    if (index === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
  });

  ctx.closePath();
}

function draw(now) {
  const box = {
    x: target.x * W,
    y: target.y * H,
    w: target.w * W,
    h: target.h * H
  };

  const size =
    box.w *
    CONFIG.virtualFeet /
    CONFIG.physicalFeet;

  const ground = Math.min(
    H - 8,
    box.y + box.h
  );

  const progress = Math.min(
    1,
    (now - startedAt) / CONFIG.riseMs
  );

  const ease =
    1 - Math.pow(1 - progress, 3);

  const x =
    box.x + box.w / 2 - size / 2;

  const y =
    ground -
    size +
    size * 1.1 * (1 - ease);

  const dx = size * 0.18;
  const dy = size * 0.17;

  const A = [x, y + dy];

  const B = [
    x + size - dx,
    y + dy
  ];

  const C = [
    x + size - dx,
    y + size
  ];

  const D = [x, y + size];

  const E = [x + dx, y];
  const F = [x + size, y];

  const G = [
    x + size,
    y + size - dy
  ];

  const pulse =
    0.5 +
    0.5 * Math.sin(
      (now - startedAt) *
      Math.PI * 2 /
      CONFIG.pulseMs
    );

  ctx.save();

  ctx.beginPath();

  ctx.rect(
    0,
    0,
    W,
    Math.max(0, ground + 3)
  );

  ctx.clip();

  ctx.fillStyle = "rgba(8,9,10,.68)";
  path([A, B, C, D]);
  ctx.fill();

  ctx.fillStyle = "rgba(28,29,30,.65)";
  path([A, E, F, B]);
  ctx.fill();

  ctx.fillStyle = "rgba(5,6,7,.72)";
  path([B, F, G, C]);
  ctx.fill();

  const edges = [
    [A, B],
    [B, C],
    [C, D],
    [D, A],
    [A, E],
    [E, F],
    [F, B],
    [F, G],
    [G, C]
  ];

  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();

    for (const [from, to] of edges) {
      ctx.moveTo(...from);
      ctx.lineTo(...to);
    }

    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    ctx.strokeStyle =
      `rgba(
        255,
        ${pass ? 235 : 210},
        ${pass ? 120 : 30},
        ${0.55 + pulse * 0.4}
      )`;

    ctx.lineWidth = pass ? 1.7 : 4;

    ctx.shadowColor = "#ffdb32";

    ctx.shadowBlur =
      pass ? 3 : 12 + pulse * 10;

    ctx.stroke();
  }

  ctx.restore();

  if (progress >= 1) {
    $("popup").classList.add("visible");

    status("There’s more to come.");
  }
}

function animate(now) {
  requestAnimationFrame(animate);

  ctx.clearRect(0, 0, W, H);

  if (
    !active ||
    document.hidden ||
    video.paused
  ) {
    return;
  }

  if (
    !detectionFailed &&
    now - lastScan >= 180
  ) {
    lastScan = now;

    try {
      inspect(now);
    } catch (error) {
      detectionFailed = true;

      status(
        "Detection stopped. Reload this page."
      );

      console.error(error);
    }
  }

  if (detectionFailed) {
    return;
  }

  if (triggered) {
    const missing = now - lastSeen;

    if (missing > 4000) {
      reset();
      return;
    }

    if (missing > 1500) {
      $("popup").classList.remove("visible");

      status(
        "Point back at the black box."
      );

      return;
    }

    draw(now);
  } else if (
    candidate &&
    now - candidateSeen < 650
  ) {
    ctx.strokeStyle =
      "rgba(255,220,81,.55)";

    ctx.lineWidth = 1.5;

    ctx.strokeRect(
      candidate.x * W,
      candidate.y * H,
      candidate.w * W,
      candidate.h * H
    );
  }
}

$("start").onclick = async () => {
  $("start").disabled = true;
  $("error").textContent = "";

  try {
    if (
      !isSecureContext ||
      !navigator.mediaDevices?.getUserMedia
    ) {
      throw new Error("HTTPS_REQUIRED");
    }

    const hasLiveCamera = stream
      ?.getVideoTracks()
      .some(track => {
        return track.readyState === "live";
      });

    if (!hasLiveCamera) {
      stream =
        await navigator.mediaDevices.getUserMedia({
          audio: false,

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          }
        });

      video.srcObject = stream;
    }

    video.muted = true;

    await video.play();

    active = true;

    reset();
    resize();

    $("welcome").hidden = true;
    $("hint").hidden = false;
  } catch (error) {
    $("start").disabled = false;
    $("start").textContent = "Try again";

    $("error").textContent =
      error.message === "HTTPS_REQUIRED"
        ? "Open your HTTPS GitHub Pages link."
        : error.name === "NotAllowedError"
          ? "Allow camera access, then try again."
          : "Could not start camera. Open this page directly in Safari or Chrome.";

    console.error(error);
  }
};

addEventListener("resize", resize);

addEventListener("pagehide", () => {
  stream?.getTracks().forEach(track => {
    track.stop();
  });

  stream = null;
  active = false;

  reset();

  $("welcome").hidden = false;
  $("hint").hidden = true;
  $("start").disabled = false;
});

document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      reset();
    }
  }
);

resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
